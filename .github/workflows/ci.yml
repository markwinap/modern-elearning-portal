name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-better-auth-secret
      BETTER_AUTH_GITHUB_CLIENT_ID: ci-client-id
      BETTER_AUTH_GITHUB_CLIENT_SECRET: ci-client-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modern-elearning-portal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modern-elearning-portal-test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ci-blob-token
      RESEND_API_KEY: ci-resend-key
      CRON_SECRET: ci-cron-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modern-elearning-portal-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to test database
        run: pnpm db:push --force

      - name: Run unit and integration tests
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-better-auth-secret
      BETTER_AUTH_GITHUB_CLIENT_ID: ci-client-id
      BETTER_AUTH_GITHUB_CLIENT_SECRET: ci-client-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modern-elearning-portal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modern-elearning-portal-test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ci-blob-token
      RESEND_API_KEY: ci-resend-key
      CRON_SECRET: ci-cron-secret
      E2E_TEACHER_EMAIL: teacher@example.com
      E2E_TEACHER_PASSWORD: password123
      E2E_STUDENT_EMAIL: student@example.com
      E2E_STUDENT_PASSWORD: password123
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modern-elearning-portal-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm test:e2e:install

      - name: Push schema to test database
        run: pnpm db:push --force

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
